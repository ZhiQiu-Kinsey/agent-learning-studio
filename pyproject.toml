[project]
name = "agent-learning-studio"
version = "0.1.0"
description = "A local, visual course for understanding and building LLM agents from scratch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "litellm==1.103.0",
    "langchain-core>=1.6.10,<2",
    "langgraph>=1.2.14,<1.3",
    "mcp>=2.3.0,<3",
    "a2a-sdk[http-server]>=1.2.2,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/ZhiQiu-Kinsey/agent-learning-studio"
Issues = "https://github.com/ZhiQiu-Kinsey/agent-learning-studio/issues"
