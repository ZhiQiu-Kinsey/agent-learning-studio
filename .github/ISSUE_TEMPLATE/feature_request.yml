name: Feature request
description: Suggest an improvement to the platform, tooling or docs. For a new lesson, use "Lesson proposal".
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or confusing today? Who runs into it (learners, lesson authors, translators)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Lesson content
        - Web UI
        - Backend / runners / event envelope
        - Model providers
        - Translations
        - Scripts and validation
        - Docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: red-lines
    attributes:
      label: Project red lines
      description: See CONTRIBUTING.md. Changes that break one of these need maintainer agreement first.
      options:
        - label: The proposal keeps run data real (no fabricated or simulated runs in the UI), keeps replay read-only and keeps secrets in the backend.
          required: true
