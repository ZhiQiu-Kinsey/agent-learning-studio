name: Bug report
description: Something in the platform, a lesson or a script doesn't work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys, tokens or the contents of `local_config.py`** — redact them before posting.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open lesson …
        2. Run exercise …
        3. …
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Lesson slug
      description: The lesson ID from the URL or `curriculum/catalog.json`, e.g. `chat-request`. Leave empty if not lesson-specific.
  - type: dropdown
    id: ui-language
    attributes:
      label: UI language
      options:
        - English
        - 简体中文
        - Both / not language-specific
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How was it run?
      description: Real-model runs and offline test fixtures behave differently; please say which one you saw.
      options:
        - Real model run in the web UI
        - Replay of a recorded run
        - Offline test fixtures (unit or browser tests)
        - Script (validate_lessons, run_live, translation_kit, …)
        - Not related to a run
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model and provider
      description: For real-model runs, e.g. "Bailian qwen-plus (raw HTTP)" or "OpenAI gpt-… via LiteLLM".
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node.js version, browser, and the commit you are on (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, errors or event excerpts
      description: Server output, browser console errors, failing test output or relevant run events. Redact any secrets.
      render: text
