name: Lesson proposal
description: Propose a new lesson, or offer to implement a planned one from the catalog.
title: "[Lesson]: "
labels: ["lesson"]
body:
  - type: markdown
    attributes:
      value: |
        A lesson teaches **one thing** and introduces at most five new course concepts. It follows
        concept → minimal implementation → run evidence → experiment → self-check.
        See CONTRIBUTING.md and docs/architecture/adding-lessons.md (Chinese) before starting.
  - type: input
    id: slug
    attributes:
      label: Lesson slug
      description: kebab-case ID. If it is already a `planned` lesson in `curriculum/catalog.json` (see docs/course-plan.md), use that slug.
      placeholder: e.g. keyword-retrieval
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - A · Native foundations
        - B · Tasks & interfaces
        - C · Context & state
        - R · Reasoning & control
        - D · Knowledge & retrieval
        - E · Frameworks & orchestration
        - K · Coding agents & sandboxes
        - F · Quality & reliability
        - G · Protocols & tool services
        - H · Capstone & delivery
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What the learner should understand
      description: The one mechanism this lesson makes visible, and the new concepts it introduces (at most five).
    validations:
      required: true
  - type: input
    id: prerequisites
    attributes:
      label: Prerequisite lessons
      description: Slugs of lessons the learner should finish first.
  - type: textarea
    id: implementation
    attributes:
      label: Minimal implementation
      description: The plain-Python mechanism, the tools it uses and the events it emits. Prefer existing event families (`lesson.report`, `lesson.plan`, `lesson.memory`, …).
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runner kind
      options:
        - native (reuses the agent tool loop)
        - custom (runtime.py with RunContext)
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Does it call a model?
      options:
        - Yes — real model in the web UI, deterministic fixtures in tests
        - No — local Python only
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: Experiment
      description: Hypothesis, control arms, what to observe, and what the result can and cannot prove.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Content language you will write
      description: Chinese is the source language; English is a translation overlay.
      options:
        - Chinese source only
        - Chinese source + English overlay
        - English draft (needs a Chinese source from someone else)
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References and licenses
      description: Tutorials, papers or code you plan to draw on, with pinned versions and licenses. Reused text or code must be compatible and attributed.
